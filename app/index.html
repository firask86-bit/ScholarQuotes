<script>
  // Route phones straight to their store. Runs before first paint so the page
  // only flashes, if at all — the buttons below are the fallback, not the path.
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/i.test(ua) ||
      // iPadOS 13+ reports itself as a Mac with touch.
      (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    var target = ios
      ? 'https://apps.apple.com/app/id815335631'
      : android
        ? 'https://play.google.com/store/apps/details?id=com.newscholarquotes'
        : null;
    // `?stay` keeps a phone on the page — for checking it, and for anyone
    // who wants to read before going to the store.
    if (target && location.search.indexOf('stay') === -1) {
      location.replace(target);
    }
  })();
</script>

<style>
  :root {
    --bg: #0f2b33;

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {

  }
  h1 {
    font-family: 'Amiri', serif; font-weight: 700;
    font-size: 44px; line-height: 1.2; margin: 22px 0 4px; color: var(--gold);
  }
  .tagline { font-size: 17px; color: var(--text); margin: 0; }
  .rule {
    display: flex; align-items: center; gap: 10px;
    margin: 22px auto; width: 70%; color: var(--gold-ink);
  }
  .rule::before, .rule::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .about { font-size: 15px; line-height: 1.9; color: var(--muted); margin: 0 0 26px; }
  .stores { display: grid; gap: 12px; }
  .store {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 18px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line);
    color: var(--text); text-decoration: none; font-size: 17px; font-weight: 700;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .store:hover, .store:focus-visible { border-color: var(--gold); outline: none; transform: translateY(-1px); }
  .store span { direction: ltr; }
  .free { margin-top: 18px; font-size: 13px; color: var(--muted); }
</style>
</head>
